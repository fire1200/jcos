<title>몽글구름 가사 박자 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 왼쪽 조작판(곡·음원·재생·탭 버튼), 오른쪽 가사 줄 목록. 좁은 화면에서는 위아래로 쌓임 */
:root {
  --bg: #eef6fd; --panel: #ffffff; --ink: #24304f; --muted: #6a7796; --line: #d6e3f2;
  --sky: #5b8fe0; --sky-soft: #dbe8fb; --pink: #e86f98; --done: #2f9e6e; --skip: #b8a06a;
  --display: "Jua", "Gowun Dodum", system-ui, sans-serif; --body: "Gowun Dodum", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a2b; --panel: #1b2640; --ink: #e8eefb; --muted: #9aa8c7; --line: #2c3a5c;
  --sky: #7fa9ef; --sky-soft: #24365c; --pink: #f08cb0; --done: #5cc79a; --skip: #d1bb83; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121a2b; --panel: #1b2640; --ink: #e8eefb; --muted: #9aa8c7; --line: #2c3a5c;
  --sky: #7fa9ef; --sky-soft: #24365c; --pink: #f08cb0; --done: #5cc79a; --skip: #d1bb83; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 20px; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); }
@media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; text-wrap: balance; }
.lead { color: var(--muted); margin: 6px 0 0; line-height: 1.6; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; align-content: start; }
.side { display: grid; gap: 16px; align-content: start; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
@media (max-width: 820px) { .side { position: static; } }
label.k { font-size: 12px; letter-spacing: .06em; color: var(--muted); display: block; margin-bottom: 6px; }
select, input[type=file], button, input[type=number] { font: inherit; color: var(--ink); }
select, input[type=number] { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); }
input[type=file] { width: 100%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--bg); padding: 9px 14px; border-radius: 999px; cursor: pointer; }
.btn:hover { border-color: var(--sky); }
.btn:focus-visible, .tap:focus-visible, select:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.btn.on { background: var(--sky-soft); border-color: var(--sky); }
.tap { font-family: var(--display); font-size: 30px; border: 0; border-radius: 22px; padding: 22px; background: var(--sky); color: #fff; cursor: pointer; width: 100%; }
.tap:active { transform: translateY(2px); }
.tap[disabled] { opacity: .45; cursor: not-allowed; }
.clock { font-variant-numeric: tabular-nums; font-family: var(--display); font-size: 40px; text-align: center; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
kbd { font-family: inherit; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; background: var(--bg); }
.now { background: var(--sky-soft); border-radius: 14px; padding: 12px 14px; min-height: 52px; display: grid; gap: 2px; }
.now .lbl { font-size: 12px; color: var(--muted); }
.now .txt { font-family: var(--display); font-size: 22px; }
.progress { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
ol.lyrics { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
ol.lyrics li { display: grid; grid-template-columns: 34px 72px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; border: 1px solid transparent; }
ol.lyrics li .n { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
ol.lyrics li .t { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
ol.lyrics li .x { min-width: 0; overflow-wrap: anywhere; font-size: 16px; }
ol.lyrics li.cur { border-color: var(--sky); background: var(--sky-soft); }
ol.lyrics li.done .t { color: var(--done); }
ol.lyrics li.skip .x { color: var(--skip); text-decoration: line-through; }
ol.lyrics li.play { background: var(--sky-soft); }
ol.lyrics li.play .x { color: var(--pink); }
.nudge { display: flex; gap: 4px; }
.nudge button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 2px 7px; cursor: pointer; font-size: 12px; color: var(--ink); }
textarea { width: 100%; min-height: 110px; font-family: ui-monospace, monospace; font-size: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 10px; box-sizing: border-box; }
.status { font-size: 13px; color: var(--done); min-height: 18px; }
.err { color: var(--pink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <div class="side">
    <div>
      <h1>가사 박자 맞추기</h1>
      <p class="lead">노래를 들으며 가사 한 줄이 <b>시작되는 순간</b>마다 탭하세요. 다 하면 아래 결과를 복사해 Claude에게 보내면 됩니다.</p>
    </div>
    <div class="panel">
      <div>
        <label class="k" for="song">곡</label>
        <select id="song"></select>
      </div>
      <div>
        <label class="k" for="file">음원 파일 (같은 곡의 mp3)</label>
        <input id="file" type="file" accept="audio/*">
        <p class="hint" id="fileHint">D:\Music\토담토담\kids_songs_20260930\audio 에서 고르세요. 7번은 C 버전.</p>
      </div>
      <audio id="audio" preload="auto"></audio>
      <div class="clock" id="clock">0:00.0</div>
      <div class="row">
        <button class="btn" id="play" type="button">▶ 처음부터 탭하기</button>
        <button class="btn" id="pause" type="button">⏸ 멈춤</button>
        <button class="btn" id="back" type="button">⏪ 3초 뒤로</button>
      </div>
      <div class="row" role="group" aria-label="재생 속도">
        <button class="btn" data-rate="0.75" type="button">0.75배</button>
        <button class="btn on" data-rate="1" type="button">1배</button>
      </div>
      <div class="now"><span class="lbl">다음에 탭할 줄</span><span class="txt" id="nextTxt">—</span></div>
      <button class="tap" id="tap" type="button" disabled>탭! <span style="font-size:15px">(스페이스바)</span></button>
      <div class="row">
        <button class="btn" id="undo" type="button">↩ 한 줄 되돌리기 <kbd>Backspace</kbd></button>
        <button class="btn" id="skip" type="button">안 부른 줄 건너뛰기 <kbd>S</kbd></button>
      </div>
      <div class="progress" id="progress"></div>
      <div class="row">
        <button class="btn" id="preview" type="button">▶ 맞춘 결과로 들어 보기</button>
      </div>
      <p class="hint">탭은 조금 늦게 눌리기 마련이라, 결과에서 <b>0.15초</b>를 자동으로 당깁니다. 줄 옆 ±버튼으로 0.1초씩 고칠 수 있습니다.</p>
    </div>
    <div class="panel">
      <label class="k" for="out">결과 (Claude에게 보낼 내용)</label>
      <textarea id="out" readonly></textarea>
      <div class="row">
        <button class="btn" id="copy" type="button">📋 결과 복사</button>
        <button class="btn" id="reset" type="button">이 곡 처음부터 다시</button>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
  </div>
  <div class="panel">
    <label class="k">가사 줄 (지금 줄이 파랗게 표시됩니다)</label>
    <ol class="lyrics" id="list"></ol>
  </div>
</div>

<script>
const SONGS = __DATA__;
const OFFSET = 0.15;
const $ = id => document.getElementById(id);
const audio = $("audio");
let song = SONGS[0], marks = [], cur = 0, previewing = false, confirmReset = false;

function key(id) { return "tapsync_" + id; }
function load() {
  try { const s = JSON.parse(localStorage.getItem(key(song.id)) || "null"); if (s && s.length === song.lines.length) return s; } catch (e) {}
  return song.lines.map(() => null);
}
function save() { try { localStorage.setItem(key(song.id), JSON.stringify(marks)); } catch (e) {} }
function fmt(t) { if (t == null) return "—"; if (t === "skip") return "건너뜀"; const m = Math.floor(t / 60), s = t - m * 60; return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1); }

function render() {
  const ol = $("list"); ol.innerHTML = "";
  song.lines.forEach((txt, i) => {
    const li = document.createElement("li");
    const m = marks[i];
    li.className = (i === cur && !previewing ? "cur " : "") + (m === "skip" ? "skip" : m != null ? "done" : "");
    li.innerHTML = `<span class="n">${i + 1}</span><span class="t">${fmt(m)}</span><span class="x"></span><span class="nudge"><button type="button" data-i="${i}" data-d="-0.1" aria-label="${i + 1}번 줄 0.1초 앞으로">−</button><button type="button" data-i="${i}" data-d="0.1" aria-label="${i + 1}번 줄 0.1초 뒤로">+</button></span>`;
    li.querySelector(".x").textContent = txt;
    li.id = "l" + i;
    ol.appendChild(li);
  });
  $("nextTxt").textContent = cur < song.lines.length ? song.lines[cur] : "끝! 결과를 복사하세요";
  const done = marks.filter(m => m != null).length;
  $("progress").textContent = `${done} / ${song.lines.length}줄 완료`;
  $("tap").disabled = !audio.src || cur >= song.lines.length;
  output();
  const el = $("l" + Math.min(cur, song.lines.length - 1));
  if (el && !previewing) el.scrollIntoView({ block: "center", behavior: "smooth" });
}
function output() {
  const lines = song.lines.map((text, i) => ({ i: i + 1, t: typeof marks[i] === "number" ? Math.max(0, +(marks[i] - OFFSET).toFixed(2)) : null, text, skip: marks[i] === "skip" || undefined }));
  $("out").value = JSON.stringify({ song: "kids" + song.id, lines });
}
function selectSong(id) {
  song = SONGS.find(s => s.id === id); marks = load();
  cur = marks.findIndex(m => m == null); if (cur < 0) cur = song.lines.length;
  audio.pause(); audio.removeAttribute("src"); $("file").value = ""; previewing = false; render();
}
function tap() {
  if (cur >= song.lines.length || !audio.src) return;
  if (audio.paused) audio.play();
  marks[cur] = +audio.currentTime.toFixed(2); cur++; save(); render();
}
function skip() { if (cur < song.lines.length) { marks[cur] = "skip"; cur++; save(); render(); } }
function undo() {
  if (cur === 0) return; cur--; const m = marks[cur]; marks[cur] = null; save();
  if (typeof m === "number" && audio.src) audio.currentTime = Math.max(0, m - 2);
  render();
}

SONGS.forEach(s => { const o = document.createElement("option"); o.value = s.id; o.textContent = s.id + ". " + s.title; $("song").appendChild(o); });
$("song").addEventListener("change", e => selectSong(e.target.value));
$("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  audio.src = URL.createObjectURL(f); $("fileHint").textContent = "불러옴: " + f.name; render();
});
$("play").addEventListener("click", () => {
  if (!audio.src) { $("status").textContent = "먼저 음원 파일을 고르세요."; $("status").className = "status err"; return; }
  previewing = false; audio.currentTime = cur > 0 && typeof marks[cur - 1] === "number" ? Math.max(0, marks[cur - 1] - 1) : 0; audio.play(); render();
});
$("pause").addEventListener("click", () => audio.pause());
$("back").addEventListener("click", () => { audio.currentTime = Math.max(0, audio.currentTime - 3); });
document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => {
  audio.playbackRate = +b.dataset.rate; document.querySelectorAll("[data-rate]").forEach(x => x.classList.toggle("on", x === b));
}));
$("tap").addEventListener("click", tap);
$("skip").addEventListener("click", skip);
$("undo").addEventListener("click", undo);
$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  const i = +b.dataset.i; if (typeof marks[i] !== "number") return;
  marks[i] = Math.max(0, +(marks[i] + +b.dataset.d).toFixed(2)); save(); render();
});
$("preview").addEventListener("click", () => {
  if (!audio.src) return; previewing = true; audio.currentTime = 0; audio.play(); render();
});
audio.addEventListener("timeupdate", () => {
  $("clock").textContent = fmt(audio.currentTime);
  if (!previewing) return;
  let k = -1; marks.forEach((m, i) => { if (typeof m === "number" && m - OFFSET <= audio.currentTime) k = i; });
  document.querySelectorAll("ol.lyrics li").forEach((li, i) => li.classList.toggle("play", i === k));
  const el = $("l" + k); if (el) el.scrollIntoView({ block: "center", behavior: "smooth" });
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "TEXTAREA") return;
  if (e.code === "Space") { e.preventDefault(); tap(); }
  else if (e.code === "Backspace") { e.preventDefault(); undo(); }
  else if (e.key === "s" || e.key === "S") { skip(); }
});
$("copy").addEventListener("click", () => {
  const t = $("out").value;
  const ok = () => { $("status").className = "status"; $("status").textContent = "복사했습니다. Claude 채팅창에 붙여 넣으세요."; };
  try { navigator.clipboard.writeText(t).then(ok, () => { $("out").select(); $("status").textContent = "결과 칸이 선택됐습니다. Ctrl+C로 복사하세요."; }); }
  catch (err) { $("out").select(); $("status").textContent = "결과 칸이 선택됐습니다. Ctrl+C로 복사하세요."; }
});
$("reset").addEventListener("click", () => {
  if (!confirmReset) { confirmReset = true; $("reset").textContent = "정말 지울까요? 한 번 더 누르기"; setTimeout(() => { confirmReset = false; $("reset").textContent = "이 곡 처음부터 다시"; }, 4000); return; }
  confirmReset = false; $("reset").textContent = "이 곡 처음부터 다시";
  marks = song.lines.map(() => null); cur = 0; save(); audio.currentTime = 0; render();
});
selectSong("03");
$("song").value = "03";
</script>
